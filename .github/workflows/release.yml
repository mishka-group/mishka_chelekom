name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 0.1.1 (empty dry-runs the version in mix.exs)
        required: false

concurrency:
  group: release

permissions:
  contents: write
  id-token: write

jobs:
  release:
    # Switch to @ci-v1 once mishka-group/mishka_cms#77 is merged and tagged.
    uses: mishka-group/mishka_cms/.github/workflows/mishka-release.yml@ci/shared-workflows
    with:
      version: ${{ inputs.version }}
      github-release: true
      ebin: true
      ebin-paths: priv
      # Gates the release as it did; semgrep.yml keeps scanning pushes, PRs and every day.
      semgrep-path: priv/assets/js
      elixir: 1.20.5-otp-29
      otp: 29.1.2
      # Some library tests run bun; the shared test job does not install it.
      pre-test: npm install -g bun
      test-args: --trace
      # credo --strict reports 2 warnings in test/ today; it was never in CI.
      credo: false
      sobelow: true
      ex-dna-args: --max-clones 0
      subprojects: '["development/mob"]'
      extra-checks: cd development/web && mix deps.get && MIX_ENV=dev mix run --no-start idempotency_check.exs
      retire-path: priv/assets/js
      # js-engine and web-harness run on every push; the rest only in a release.
      # android-e2e-N: one shard of the device suite per entry, on an emulator.
      custom-jobs: >-
        [{"name":"js-engine","setup":["node"],"run":"cd priv/assets/js && node --test"},
         {"name":"web-harness","setup":["elixir","bun"],"run":".github/scripts/web_harness.sh"},
         {"name":"cms-bundles","setup":["elixir"],"run":".github/scripts/cms_bundles.sh","artifacts":"dist/*.json","release-only":true},
         {"name":"android-apks","setup":["elixir","java","gradle","android-sdk","zig"],"java-version":"17","ndk-version":"27.2.12479018","zig-version":"0.17.0",
          "run":".github/scripts/android_release.sh","artifacts":"development/mob/dist/*","release-only":true,"timeout":90},
         {"name":"android-e2e-1","setup":["elixir","java","gradle","android-sdk","zig"],"java-version":"17","ndk-version":"27.2.12479018","zig-version":"0.17.0",
          "run":".github/scripts/android_e2e_build.sh","emulator":{"api-level":34,"script":".github/scripts/android_e2e.sh 1 2"},"release-only":true,"timeout":60},
         {"name":"android-e2e-2","setup":["elixir","java","gradle","android-sdk","zig"],"java-version":"17","ndk-version":"27.2.12479018","zig-version":"0.17.0",
          "run":".github/scripts/android_e2e_build.sh","emulator":{"api-level":34,"script":".github/scripts/android_e2e.sh 2 2"},"release-only":true,"timeout":60}]
    secrets: inherit
