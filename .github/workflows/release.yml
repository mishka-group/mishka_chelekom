name: Release

# A `v*` tag publishes the release. Pushing the CI branch runs every build and check
# exactly as the tag would, uploads the same artifacts, and stops short of publishing —
# so the pipeline can be proven green before a tag is ever cut.
on:
  push:
    tags: ["v*"]
    branches: ["ci/tag-release"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ELIXIR_VERSION: "1.18.4"
  OTP_VERSION: "28"
  # development/web is developed and formatted on 1.19.5, and test.yml already pins that
  # for it. The formatter's output moved between 1.18 and 1.19, so checking the harness's
  # generated components under 1.18 flags files that are correctly formatted for 1.19.
  WEB_ELIXIR_VERSION: "1.19.5"
  MOB_ELIXIR_VERSION: "1.20.2"
  MOB_OTP_VERSION: "29.0.2"
  ANDROID_NDK_VERSION: "27.2.12479018"
  JAVA_VERSION: "17"

jobs:
  # ── 1. The version, resolved once ────────────────────────────────────────────
  # Every downstream job reads mix.exs through this output instead of parsing it
  # again, so a tag, an APK's versionName and a bundle's version can never disagree.
  version:
    name: Resolve version from mix.exs
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
      only_android: ${{ steps.v.outputs.only_android }}
    steps:
      - uses: actions/checkout@v5

      - name: Read @version and reconcile it with the ref
        id: v
        run: |
          set -euo pipefail
          version="$(sed -n 's/^  @version "\(.*\)"$/\1/p' mix.exs | head -1)"
          if [ -z "$version" ]; then
            echo "::error file=mix.exs::could not parse @version from mix.exs"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # TEMPORARY: skip the non-Android jobs while narrowing the crash.
          echo "only_android=true" >> "$GITHUB_OUTPUT"

          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
            if [ "$tag" != "v$version" ]; then
              echo "::error file=mix.exs::tag $tag does not match mix.exs @version $version (expected v$version)"
              exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

          echo "### Release $version" >> "$GITHUB_STEP_SUMMARY"
          echo "publish: $([ "${{ github.ref_type }}" = "tag" ] && echo yes || echo 'no (dry run)')" >> "$GITHUB_STEP_SUMMARY"

  # ── 2. Library test suite ────────────────────────────────────────────────────
  library-test:
    name: Library tests
    needs: version
    if: ${{ needs.version.outputs.only_android != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The assets tests shell out to bun; without it they read the "Running bun
      # install..." banner instead of the success line and fail. test.yml installs it
      # for the same reason.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: erlef/setup-beam@v1.20.4
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/cache@v4.2.4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-rel-mix-${{ env.ELIXIR_VERSION }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-rel-mix-${{ env.ELIXIR_VERSION }}-
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      - run: mix test
        env:
          MIX_ENV: test

  # ── 3. Generators must still be idempotent ───────────────────────────────────
  idempotency:
    name: Generators are idempotent
    needs: version
    if: ${{ needs.version.outputs.only_android != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1.20.4
        with:
          elixir-version: ${{ env.WEB_ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - name: Install development harness deps
        working-directory: development/web
        run: mix deps.get
      - name: Re-run the generators and diff
        working-directory: development/web
        env:
          MIX_ENV: dev
        run: mix run --no-start idempotency_check.exs

  # ── 3b. Harness test suite ───────────────────────────────────────────────────
  # development/web has its own suite (showcase LiveViews, the styled components as
  # generated, the CLI generator tasks) and neither this workflow nor test.yml ran it —
  # test.yml only drives the idempotency check above.
  web-test:
    name: Harness tests (development/web)
    needs: version
    if: ${{ needs.version.outputs.only_android != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The editor component is npm-backed, and editor_live_test asserts the packages
      # are really installed rather than merely declared. `mix assets.setup` runs
      # mishka.assets.install, which shells out to bun.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: erlef/setup-beam@v1.20.4
        with:
          elixir-version: ${{ env.WEB_ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - working-directory: development/web
        run: mix deps.get
      - working-directory: development/web
        run: mix assets.setup
      - working-directory: development/web
        run: mix compile --warnings-as-errors
      - working-directory: development/web
        run: mix format --check-formatted
      - working-directory: development/web
        run: mix test
        env:
          MIX_ENV: test

  # ── 3c. Security scans, at the tagged commit ─────────────────────────────────
  # semgrep.yml and retire-js.yml cover pull requests and master, and CodeQL's default
  # setup covers the default branch weekly — but none of them run on a tag, so a release
  # could be cut from a commit nothing had scanned. Same tools and same scope as the
  # standalone workflows, run here so they gate the release.
  #
  # Both mirror their existing invocation rather than tightening it: semgrep only fails
  # the job on findings with `--error`, which would change what the repo already accepts.
  # Add it here when the team wants findings to block a tag.
  #
  # CodeQL is deliberately absent. This repo has code-scanning *default setup* enabled,
  # and GitHub refuses to run github/codeql-action while that is on — the job errors
  # rather than scanning. Covering tags with CodeQL means converting the repo to advanced
  # setup, which is a separate decision.
  semgrep:
    name: Semgrep CE
    needs: version
    if: ${{ needs.version.outputs.only_android != 'true' }}
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v5
      - run: semgrep scan --config auto priv/assets/js

  retire-js:
    name: Retire.js
    needs: version
    if: ${{ needs.version.outputs.only_android != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install -g retire
      - run: retire --path priv/assets/js --severity medium

  # ── 4. CMS UI-kit bundles ────────────────────────────────────────────────────
  # Regenerated at the release version rather than shipping whatever is committed,
  # so `ui_kit_version` inside the bundle matches the tag it is published under.
  cms-bundles:
    name: CMS bundles (--cms)
    needs: version
    if: ${{ needs.version.outputs.only_android != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1.20.4
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - run: mix deps.get
      - run: mix compile

      - name: Export the styled kit
        run: >
          mix mishka.ui.export priv/components --cms
          --name chelekom --bundle-name chelekom
          --bundle-version ${{ needs.version.outputs.version }} --yes

      - name: Export the headless kit
        run: >
          mix mishka.ui.export priv/headless --cms
          --name chelekom_headless --bundle-name chelekom_headless
          --bundle-version ${{ needs.version.outputs.version }} --yes

      - name: Collect and verify both bundles
        run: |
          set -euo pipefail
          mkdir -p dist
          cp priv/components/chelekom.json dist/chelekom.json
          cp priv/headless/chelekom_headless.json dist/chelekom_headless.json
          for f in dist/chelekom.json dist/chelekom_headless.json; do
            # A bundle that is not valid JSON, lost its components, or carries the wrong
            # version must not ship.
            n="$(jq '.components | length' "$f")"
            got="$(jq -r '.version' "$f")"
            [ "$n" -gt 0 ] || { echo "::error::$f has no components"; exit 1; }
            [ "$got" = "${{ needs.version.outputs.version }}" ] \
              || { echo "::error::$f says version $got"; exit 1; }
            echo "$f: $n components, version $got"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: cms-bundles
          path: dist/*.json
          if-no-files-found: error

  # ── 5. Hex package tarball ───────────────────────────────────────────────────
  hex-package:
    name: Hex package (.tar)
    needs: version
    if: ${{ needs.version.outputs.only_android != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1.20.4
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - run: mix deps.get
      - name: Build the package Hex would publish
        run: mix hex.build
      - name: Check the tarball is the release version
        run: |
          set -euo pipefail
          tar="mishka_chelekom-${{ needs.version.outputs.version }}.tar"
          test -f "$tar" || { echo "::error::expected $tar, got: $(ls *.tar 2>/dev/null || echo none)"; exit 1; }
          mkdir -p dist && mv "$tar" dist/
      - uses: actions/upload-artifact@v4
        with:
          name: hex-package
          path: dist/*.tar
          if-no-files-found: error

  # ── 6. Compiled BEAM (ebin) ──────────────────────────────────────────────────
  ebin-package:
    name: Compiled ebin
    needs: version
    if: ${{ needs.version.outputs.only_android != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1.20.4
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - run: mix deps.get
      - name: Compile for :prod
        run: mix compile
        env:
          MIX_ENV: prod
      - name: Tar the ebin and its priv
        run: |
          set -euo pipefail
          v="${{ needs.version.outputs.version }}"
          src="_build/prod/lib/mishka_chelekom"
          test -d "$src/ebin" || { echo "::error::$src/ebin not found"; exit 1; }
          test -n "$(ls -A "$src/ebin"/*.beam 2>/dev/null)" || { echo "::error::no .beam files in $src/ebin"; exit 1; }
          mkdir -p dist
          # `priv` rides along: the generator resolves its templates through
          # :code.priv_dir(:mishka_chelekom), so an ebin with no priv cannot generate.
          # In _build it is a symlink back to the repo, hence -h to follow it.
          extra=""
          [ -d "$src/consolidated" ] && extra="consolidated"
          tar -czhf "dist/mishka_chelekom-$v-ebin.tar.gz" -C "$src" ebin priv $extra
          # grep -c, not grep -q: -q exits on the first match, tar takes SIGPIPE, and
          # pipefail then reports a perfectly good tarball as broken. -c drains the input.
          mods="$(tar -tzf "dist/mishka_chelekom-$v-ebin.tar.gz" \
                  | grep -c '^ebin/Elixir\.MishkaChelekom' || true)"
          [ "$mods" -gt 0 ] \
            || { echo "::error::ebin tarball is missing the library's modules"; exit 1; }
          echo "ebin tarball: $mods MishkaChelekom modules"
          echo "OTP $(erl -noshell -eval 'io:format("~s",[erlang:system_info(otp_release)]),halt().')," \
               "Elixir $(elixir -v | tail -1)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ebin-package
          path: dist/*.tar.gz
          if-no-files-found: error

  # ── 7. Mob unit tests ────────────────────────────────────────────────────────
  mob-test:
    name: Mob tests
    needs: version
    if: ${{ needs.version.outputs.only_android != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1.20.4
        with:
          elixir-version: ${{ env.MOB_ELIXIR_VERSION }}
          otp-version: ${{ env.MOB_OTP_VERSION }}
      - working-directory: development/mob
        run: mix deps.get
      - working-directory: development/mob
        run: mix compile --warnings-as-errors
      - working-directory: development/mob
        run: mix format --check-formatted
      - working-directory: development/mob
        run: mix test
        env:
          MIX_ENV: test

  # ── 8. Android APKs ──────────────────────────────────────────────────────────
  # `mix mob.release --android` stages the OTP runtime into assets/otp.zip and builds
  # the AAB; the second Gradle call reuses that staging to emit the split APKs. Signed
  # only when the keystore secrets are present — otherwise the APKs are unsigned, which
  # is fine for a GitHub release and rejected by Play, as intended.
  android-apks:
    name: Android APKs (v8 / v7 / universal)
    # Packaging follows verification: there is no point shipping an APK whose behaviour
    # the device suite has not confirmed. A real dependency — android-e2e no longer
    # carries continue-on-error, so a red or hung suite stops the APK and the release.
    needs: [version, mob-test, android-e2e]
    runs-on: ubuntu-latest
    # As ORG_GRADLE_PROJECT_* rather than -P, so the AAB that `mix mob.release` builds and
    # the APKs assembled afterwards carry the same version. `splitAbi` stays a -P flag on
    # the assemble call alone — the AAB must not be split.
    env:
      ORG_GRADLE_PROJECT_mobVersionName: ${{ needs.version.outputs.version }}
      ORG_GRADLE_PROJECT_mobVersionCode: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: erlef/setup-beam@v1.20.4
        with:
          elixir-version: ${{ env.MOB_ELIXIR_VERSION }}
          otp-version: ${{ env.MOB_OTP_VERSION }}

      - uses: android-actions/setup-android@v3

      - name: Install the pinned NDK
        run: sdkmanager --install "ndk;${{ env.ANDROID_NDK_VERSION }}" "cmake;3.22.1"

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache the Mob OTP runtimes
        uses: actions/cache@v4.2.4
        with:
          path: ~/.mob/cache
          key: ${{ runner.os }}-mob-otp-${{ hashFiles('development/mob/mix.lock') }}
          restore-keys: ${{ runner.os }}-mob-otp-

      - working-directory: development/mob
        run: mix deps.get

      - name: Write mob.exs (gitignored — machine-specific by design)
        working-directory: development/mob
        run: |
          set -euo pipefail
          test -f mob.exs || cat > mob.exs <<'EOF'
          import Config

          config :mob_dev,
            mob_dir: Path.join(File.cwd!(), "deps/mob"),
            elixir_lib:
              System.get_env("MOB_ELIXIR_LIB", :code.lib_dir(:elixir) |> to_string() |> Path.dirname())

          config :mob, :plugins, [:mob_camera, :mob_location, :mob_biometric]

          # The activated first-party plugins are signed with the shared mob release key,
          # and the native build refuses to run against an untrusted one. These are the
          # same fingerprints mob.new scaffolds into mob.exs; without them the build stops
          # at "plugin signature check failed" before it compiles anything.
          config :mob, :trusted_plugins, %{
            mob_camera: "ed25519:nc56w+1Kx0gIt/4EkHxnMZCKHMzp4+S5kS/HoSzEZkg=",
            mob_location: "ed25519:nc56w+1Kx0gIt/4EkHxnMZCKHMzp4+S5kS/HoSzEZkg=",
            mob_biometric: "ed25519:nc56w+1Kx0gIt/4EkHxnMZCKHMzp4+S5kS/HoSzEZkg="
          }
          EOF

      - name: Prefetch the Android OTP runtimes
        working-directory: development/mob
        run: |
          set -euo pipefail
          # `mix mob.install` is the documented first run, but it PROMPTS for the machine
          # paths and would hang here. It writes android/local.properties — and mob_dev
          # gates the whole Android chain on that file existing ("Skipping Android build
          # — toolchain not detected"), so exporting the equivalent env vars is not
          # enough even though build.gradle would accept them. Write the file it writes.
          mix run --no-start -e '
            paths =
              for {abi, key} <- [
                    {"arm64-v8a", "mob.otp_release"},
                    {"armeabi-v7a", "mob.otp_release_arm32"},
                    {"x86_64", "mob.otp_release_x86_64"}
                  ] do
                {:ok, path} = MobDev.OtpDownloader.ensure_android(abi)
                IO.puts("#{abi} -> #{path}")
                "#{key}=#{path}"
              end

            props =
              [
                "sdk.dir=#{System.fetch_env!("ANDROID_HOME")}",
                "mob.mob_dir=#{Path.join(File.cwd!(), "deps/mob")}"
                | paths
              ]

            File.write!("android/local.properties", Enum.join(props, "\n") <> "\n")
          '
          cat android/local.properties

      - name: Environment check
        working-directory: development/mob
        # Informational: mob.doctor raises on any failed check, and a runner with no
        # device attached legitimately fails some of them.
        run: mix mob.doctor || true

      - name: Decode the upload keystore, if configured
        working-directory: development/mob/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::notice::no ANDROID_KEYSTORE_BASE64 secret — release APKs will be unsigned"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > upload_jks.keystore
          cat > keystore.properties <<EOF
          storeFile=upload_jks.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      # mob 0.7+ compiles the JNI layer with build.zig; CMake's mob_nif.c path is a
      # legacy fallback whose sources the dep no longer ships. `mob.release --android`
      # does not run that step — on a dev machine it only works because
      # `mix android.native` already left android/app/build/zig-out/<abi>/ behind, which
      # CMakeLists prefers. A clean runner has neither, so CMake falls back to the
      # missing .c and configure fails.
      #
      # build_all/1 runs the zig build and the Gradle assemble, then tries to adb-install
      # and push the release — the last two need a device and are expected to fail here.
      # They come after the steps we need, so the failure is tolerated and the artifact
      # itself is what gets asserted.
      - name: Build the JNI objects with zig
        working-directory: development/mob
        run: |
          set -euo pipefail
          mix run --no-start \
            -e 'MobDev.NativeBuild.build_all(platforms: [:android]) |> IO.inspect(label: "native")' \
            || echo "::notice::native build returned non-zero (expected: no device attached)"

          # build_android/2 names this artifact itself, and reaching it means zig, CMake
          # for every ABI and the generated io.mob.plugin Kotlin all went through.
          # Globbing zig-out for .o files was the wrong proxy — and a failed `ls` under
          # `set -e` with pipefail killed the step before it could print why.
          apk="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$apk" ]; then
            echo "::error::native build produced no $apk — the Android chain did not complete"
            find android/app/build/outputs -name '*.apk' 2>/dev/null || true
            exit 1
          fi
          echo "native chain complete: $apk ($(du -h "$apk" | cut -f1))"

      - name: Stage otp.zip and build the AAB
        working-directory: development/mob
        run: mix mob.release --android

      - name: Assemble the split APKs from the same staging
        working-directory: development/mob/android
        run: |
          set -euo pipefail
          ./gradlew assembleRelease --no-daemon -PsplitAbi

      - name: Name the outputs after the release
        working-directory: development/mob
        run: |
          set -euo pipefail
          v="${{ needs.version.outputs.version }}"
          out="android/app/build/outputs/apk/release"
          mkdir -p dist
          # AGP names split outputs app-<abi>-release[-unsigned].apk; the glob covers both.
          pick() {
            local match
            match="$(ls "$out"/app-$1-release*.apk 2>/dev/null | head -1 || true)"
            if [ -z "$match" ]; then
              echo "::error::no APK matched app-$1-release*.apk in $out"
              ls -la "$out" || true
              exit 1
            fi
            cp "$match" "dist/mishka_mob_${v}_android_$2.apk"
            echo "  $2 <- $(basename "$match")"
          }
          pick "arm64-v8a"   "arm64-v8a"
          pick "armeabi-v7a" "armeabi-v7a"
          pick "universal"   "universal"
          aab="$(ls android/app/build/outputs/bundle/release/*.aab 2>/dev/null | head -1 || true)"
          [ -n "$aab" ] && cp "$aab" "dist/mishka_mob_${v}_android.aab"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: development/mob/dist/*
          if-no-files-found: error

  # ── 9. Android e2e (instrumentation on an emulator) ──────────────────────────
  # Kept apart from the APK job: it needs KVM and an emulator, fails for reasons that
  # have nothing to do with packaging, and must never be what stops a release building.
  android-e2e:
    name: Android e2e
    needs: [version]
    runs-on: ubuntu-latest
    # `am instrument` buffers its output, so a wedged test looks exactly like a slow
    # one: silence either way. Without a cap the job would sit on the runner for the
    # 6h default before anyone learned anything — one hung run cost 67 minutes before
    # it was killed by hand. ~400 tests at the ~4s/test the suite actually managed is
    # ~30m, so this bounds a wedge at roughly twice that.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: erlef/setup-beam@v1.20.4
        with:
          elixir-version: ${{ env.MOB_ELIXIR_VERSION }}
          otp-version: ${{ env.MOB_OTP_VERSION }}

      - uses: android-actions/setup-android@v3

      - name: Install the pinned NDK
        run: sdkmanager --install "ndk;${{ env.ANDROID_NDK_VERSION }}" "cmake;3.22.1"

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache the Mob OTP runtimes
        uses: actions/cache@v4.2.4
        with:
          path: ~/.mob/cache
          key: ${{ runner.os }}-mob-otp-${{ hashFiles('development/mob/mix.lock') }}
          restore-keys: ${{ runner.os }}-mob-otp-

      - working-directory: development/mob
        run: mix deps.get

      - name: Write mob.exs (gitignored — machine-specific by design)
        working-directory: development/mob
        run: |
          set -euo pipefail
          test -f mob.exs || cat > mob.exs <<'EOF'
          import Config

          config :mob_dev,
            mob_dir: Path.join(File.cwd!(), "deps/mob"),
            elixir_lib:
              System.get_env("MOB_ELIXIR_LIB", :code.lib_dir(:elixir) |> to_string() |> Path.dirname())

          config :mob, :plugins, [:mob_camera, :mob_location, :mob_biometric]

          # The activated first-party plugins are signed with the shared mob release key,
          # and the native build refuses to run against an untrusted one. These are the
          # same fingerprints mob.new scaffolds into mob.exs; without them the build stops
          # at "plugin signature check failed" before it compiles anything.
          config :mob, :trusted_plugins, %{
            mob_camera: "ed25519:nc56w+1Kx0gIt/4EkHxnMZCKHMzp4+S5kS/HoSzEZkg=",
            mob_location: "ed25519:nc56w+1Kx0gIt/4EkHxnMZCKHMzp4+S5kS/HoSzEZkg=",
            mob_biometric: "ed25519:nc56w+1Kx0gIt/4EkHxnMZCKHMzp4+S5kS/HoSzEZkg="
          }
          EOF

      - name: Prefetch the Android OTP runtimes
        working-directory: development/mob
        run: |
          set -euo pipefail
          # `mix mob.install` is the documented first run, but it PROMPTS for the machine
          # paths and would hang here. It writes android/local.properties — and mob_dev
          # gates the whole Android chain on that file existing ("Skipping Android build
          # — toolchain not detected"), so exporting the equivalent env vars is not
          # enough even though build.gradle would accept them. Write the file it writes.
          mix run --no-start -e '
            paths =
              for {abi, key} <- [
                    {"arm64-v8a", "mob.otp_release"},
                    {"armeabi-v7a", "mob.otp_release_arm32"},
                    {"x86_64", "mob.otp_release_x86_64"}
                  ] do
                {:ok, path} = MobDev.OtpDownloader.ensure_android(abi)
                IO.puts("#{abi} -> #{path}")
                "#{key}=#{path}"
              end

            props =
              [
                "sdk.dir=#{System.fetch_env!("ANDROID_HOME")}",
                "mob.mob_dir=#{Path.join(File.cwd!(), "deps/mob")}"
                | paths
              ]

            File.write!("android/local.properties", Enum.join(props, "\n") <> "\n")
          '
          cat android/local.properties

      # `mix e2e` installs only the test APK and reads the verdict out of the
      # instrumentation output — `am instrument` exits 0 even when tests fail.
      - name: Deploy and run the device suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          working-directory: development/mob
          script: |
            mix android.native
            # Logcat in the background: the instrumentation summary says a process
            # crashed but not why, and the Java stack behind it only exists here.
            adb logcat -c || true
            (adb logcat -v time > "$RUNNER_TEMP/logcat.txt" 2>&1 &) || true
            # TEMPORARY: two classes, not 52. DisplayTest passes alone and crashes
            # after eleven others, with byte-identical arithmetic every run — so the
            # trigger is deterministic and cumulative, not a race. If ONE prior class is
            # enough, the repro is 8 minutes instead of 20 and the cause is "the second
            # Activity", not "eleven classes of accumulation".
            mix e2e AccordionTest DisplayTest

      - name: Show the crash context from logcat
        if: failure()
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/logcat.txt"
          [ -f "$f" ] || { echo "no logcat captured"; exit 0; }
          echo "── AndroidRuntime / Compose / mob ─────────────────────────────"
          grep -nE "AndroidRuntime|FATAL|Compose|SlotTable|mishka_mob|MobBridge" "$f" \
            | tail -120 || echo "(no matching lines)"

      - name: Keep the emulator logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e-logs
          path: |
            development/mob/android/app/build/reports/**
            development/mob/*.log
            ${{ runner.temp }}/logcat.txt
          if-no-files-found: ignore

  # ── 10. Publish ──────────────────────────────────────────────────────────────
  # Only a tag publishes. On the CI branch every job above still runs and every
  # artifact is still produced — this is the one step that is skipped.
  release:
    name: Publish GitHub release
    needs:
      - version
      - library-test
      - idempotency
      - web-test
      - semgrep
      - retire-js
      - cms-bundles
      - hex-package
      - ebin-package
      - mob-test
      - android-apks
      - android-e2e
    if: ${{ needs.version.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Lay the assets out flat and confirm every one arrived
        run: |
          set -euo pipefail
          v="${{ needs.version.outputs.version }}"
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          expected=(
            "chelekom.json"
            "chelekom_headless.json"
            "mishka_chelekom-$v.tar"
            "mishka_chelekom-$v-ebin.tar.gz"
            "mishka_mob_${v}_android_arm64-v8a.apk"
            "mishka_mob_${v}_android_armeabi-v7a.apk"
            "mishka_mob_${v}_android_universal.apk"
          )
          missing=0
          for f in "${expected[@]}"; do
            if [ ! -f "release/$f" ]; then echo "::error::missing release asset: $f"; missing=1; fi
          done
          [ "$missing" -eq 0 ] || { ls -la release; exit 1; }
          ( cd release && sha256sum * > SHA256SUMS.txt )
          ls -la release

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: v${{ needs.version.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/*
