name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ELIXIR_VERSION: "1.18.4"
  OTP_VERSION: "28"
  WEB_ELIXIR_VERSION: "1.19.5"
  MOB_ELIXIR_VERSION: "1.20.2"
  MOB_OTP_VERSION: "29.0.2"
  ANDROID_NDK_VERSION: "27.2.12479018"
  JAVA_VERSION: "17"

jobs:
  version:
    name: Resolve version from mix.exs
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read @version and reconcile it with the ref
        id: v
        run: |
          set -euo pipefail
          version="$(sed -n 's/^  @version "\(.*\)"$/\1/p' mix.exs | head -1)"
          if [ -z "$version" ]; then
            echo "::error file=mix.exs::could not parse @version from mix.exs"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
            if [ "$tag" != "v$version" ]; then
              echo "::error file=mix.exs::tag $tag does not match mix.exs @version $version (expected v$version)"
              exit 1
            fi

            git fetch --no-tags --quiet origin master
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
              echo "::error::tag $tag points at a commit that is not on master"
              exit 1
            fi

            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

          echo "### Release $version" >> "$GITHUB_STEP_SUMMARY"
          echo "publish: $([ "${{ github.ref_type }}" = "tag" ] && echo yes || echo 'no (dry run)')" >> "$GITHUB_STEP_SUMMARY"

  library-test:
    name: Library tests
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: erlef/setup-beam@v1.20.4
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/cache@v4.2.4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-rel-mix-${{ env.ELIXIR_VERSION }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-rel-mix-${{ env.ELIXIR_VERSION }}-
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      - run: mix test
        env:
          MIX_ENV: test

  idempotency:
    name: Generators are idempotent
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1.20.4
        with:
          elixir-version: ${{ env.WEB_ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - name: Install development harness deps
        working-directory: development/web
        run: mix deps.get
      - name: Re-run the generators and diff
        working-directory: development/web
        env:
          MIX_ENV: dev
        run: mix run --no-start idempotency_check.exs

  web-test:
    name: Harness tests (development/web)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: erlef/setup-beam@v1.20.4
        with:
          elixir-version: ${{ env.WEB_ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - working-directory: development/web
        run: mix deps.get
      - working-directory: development/web
        run: mix assets.setup
      - working-directory: development/web
        run: mix compile --warnings-as-errors
      - working-directory: development/web
        run: mix format --check-formatted
      - working-directory: development/web
        run: mix test
        env:
          MIX_ENV: test

  semgrep:
    name: Semgrep CE
    needs: version
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v5
      - run: semgrep scan --config auto priv/assets/js

  retire-js:
    name: Retire.js
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install -g retire
      - run: retire --path priv/assets/js --severity medium

  deps-audit:
    name: Dependency advisories
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { dir: ".", elixir: "1.18.4", otp: "28" }
          - { dir: "development/web", elixir: "1.19.5", otp: "28" }
          - { dir: "development/mob", elixir: "1.20.2", otp: "29.0.2" }
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1.20.4
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - working-directory: ${{ matrix.dir }}
        run: mix deps.get
      - working-directory: ${{ matrix.dir }}
        run: mix deps.unlock --check-unused
      - working-directory: ${{ matrix.dir }}
        run: mix deps.audit
      - working-directory: ${{ matrix.dir }}
        run: mix hex.audit

  cms-bundles:
    name: CMS bundles (--cms)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1.20.4
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - run: mix deps.get
      - run: mix compile

      - name: Export the styled kit
        run: >
          mix mishka.ui.export priv/components --cms
          --name chelekom --bundle-name chelekom
          --bundle-version ${{ needs.version.outputs.version }} --yes

      - name: Export the headless kit
        run: >
          mix mishka.ui.export priv/headless --cms
          --name chelekom_headless --bundle-name chelekom_headless
          --bundle-version ${{ needs.version.outputs.version }} --yes

      - name: Collect and verify both bundles
        run: |
          set -euo pipefail
          mkdir -p dist
          cp priv/components/chelekom.json dist/chelekom.json
          cp priv/headless/chelekom_headless.json dist/chelekom_headless.json
          for f in dist/chelekom.json dist/chelekom_headless.json; do
            n="$(jq '.components | length' "$f")"
            got="$(jq -r '.version' "$f")"
            [ "$n" -gt 0 ] || { echo "::error::$f has no components"; exit 1; }
            [ "$got" = "${{ needs.version.outputs.version }}" ] \
              || { echo "::error::$f says version $got"; exit 1; }
            echo "$f: $n components, version $got"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: cms-bundles
          path: dist/*.json
          if-no-files-found: error

  hex-package:
    name: Hex package (.tar)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1.20.4
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - run: mix deps.get
      - name: Build the package Hex would publish
        run: mix hex.build
      - name: Check the tarball is the release version
        run: |
          set -euo pipefail
          tar="mishka_chelekom-${{ needs.version.outputs.version }}.tar"
          test -f "$tar" || { echo "::error::expected $tar, got: $(ls *.tar 2>/dev/null || echo none)"; exit 1; }
          mkdir -p dist && mv "$tar" dist/
      - uses: actions/upload-artifact@v4
        with:
          name: hex-package
          path: dist/*.tar
          if-no-files-found: error

  ebin-package:
    name: Compiled ebin
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1.20.4
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - run: mix deps.get
      - name: Compile for :prod
        run: mix compile
        env:
          MIX_ENV: prod
      - name: Tar the ebin and its priv
        run: |
          set -euo pipefail
          v="${{ needs.version.outputs.version }}"
          src="_build/prod/lib/mishka_chelekom"
          test -d "$src/ebin" || { echo "::error::$src/ebin not found"; exit 1; }
          test -n "$(ls -A "$src/ebin"/*.beam 2>/dev/null)" || { echo "::error::no .beam files in $src/ebin"; exit 1; }
          mkdir -p dist
          extra=""
          [ -d "$src/consolidated" ] && extra="consolidated"
          tar -czhf "dist/mishka_chelekom-$v-ebin.tar.gz" -C "$src" ebin priv $extra
          mods="$(tar -tzf "dist/mishka_chelekom-$v-ebin.tar.gz" \
                  | grep -c '^ebin/Elixir\.MishkaChelekom' || true)"
          [ "$mods" -gt 0 ] \
            || { echo "::error::ebin tarball is missing the library's modules"; exit 1; }
          echo "ebin tarball: $mods MishkaChelekom modules"
          echo "OTP $(erl -noshell -eval 'io:format("~s",[erlang:system_info(otp_release)]),halt().')," \
               "Elixir $(elixir -v | tail -1)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ebin-package
          path: dist/*.tar.gz
          if-no-files-found: error

  mob-test:
    name: Mob tests
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1.20.4
        with:
          elixir-version: ${{ env.MOB_ELIXIR_VERSION }}
          otp-version: ${{ env.MOB_OTP_VERSION }}
      - working-directory: development/mob
        run: mix deps.get
      - working-directory: development/mob
        run: mix compile --warnings-as-errors
      - working-directory: development/mob
        run: mix format --check-formatted
      - working-directory: development/mob
        run: mix test
        env:
          MIX_ENV: test

  android-apks:
    name: Android APKs (v8 / v7 / universal)
    needs: [version, mob-test, android-e2e]
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_mobVersionName: ${{ needs.version.outputs.version }}
      ORG_GRADLE_PROJECT_mobVersionCode: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: erlef/setup-beam@v1.20.4
        with:
          elixir-version: ${{ env.MOB_ELIXIR_VERSION }}
          otp-version: ${{ env.MOB_OTP_VERSION }}

      - uses: android-actions/setup-android@v3

      - name: Install the pinned NDK
        run: sdkmanager --install "ndk;${{ env.ANDROID_NDK_VERSION }}" "cmake;3.22.1"

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache the Mob OTP runtimes
        uses: actions/cache@v4.2.4
        with:
          path: ~/.mob/cache
          key: ${{ runner.os }}-mob-otp-${{ hashFiles('development/mob/mix.lock') }}
          restore-keys: ${{ runner.os }}-mob-otp-

      - working-directory: development/mob
        run: mix deps.get

      - name: Write mob.exs (gitignored — machine-specific by design)
        working-directory: development/mob
        run: |
          set -euo pipefail
          test -f mob.exs || cat > mob.exs <<'EOF'
          import Config

          config :mob_dev,
            mob_dir: Path.join(File.cwd!(), "deps/mob"),
            elixir_lib:
              System.get_env("MOB_ELIXIR_LIB", :code.lib_dir(:elixir) |> to_string() |> Path.dirname())

          config :mob, :plugins, [:mob_camera, :mob_location, :mob_biometric]

          config :mob, :trusted_plugins, %{
            mob_camera: "ed25519:nc56w+1Kx0gIt/4EkHxnMZCKHMzp4+S5kS/HoSzEZkg=",
            mob_location: "ed25519:nc56w+1Kx0gIt/4EkHxnMZCKHMzp4+S5kS/HoSzEZkg=",
            mob_biometric: "ed25519:nc56w+1Kx0gIt/4EkHxnMZCKHMzp4+S5kS/HoSzEZkg="
          }
          EOF

      - name: Prefetch the Android OTP runtimes
        working-directory: development/mob
        run: |
          set -euo pipefail
          mix run --no-start -e '
            paths =
              for {abi, key} <- [
                    {"arm64-v8a", "mob.otp_release"},
                    {"armeabi-v7a", "mob.otp_release_arm32"},
                    {"x86_64", "mob.otp_release_x86_64"}
                  ] do
                {:ok, path} = MobDev.OtpDownloader.ensure_android(abi)
                IO.puts("#{abi} -> #{path}")
                "#{key}=#{path}"
              end

            props =
              [
                "sdk.dir=#{System.fetch_env!("ANDROID_HOME")}",
                "mob.mob_dir=#{Path.join(File.cwd!(), "deps/mob")}"
                | paths
              ]

            File.write!("android/local.properties", Enum.join(props, "\n") <> "\n")
          '
          cat android/local.properties

      - name: Environment check
        working-directory: development/mob
        run: mix mob.doctor || true

      - name: Decode the upload keystore, if configured
        working-directory: development/mob/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::notice::no ANDROID_KEYSTORE_BASE64 secret — release APKs will be unsigned"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > upload_jks.keystore
          cat > keystore.properties <<EOF
          storeFile=upload_jks.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build the JNI objects with zig
        working-directory: development/mob
        run: |
          set -euo pipefail
          mix run --no-start \
            -e 'MobDev.NativeBuild.build_all(platforms: [:android]) |> IO.inspect(label: "native")' \
            || echo "::notice::native build returned non-zero (expected: no device attached)"

          apk="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$apk" ]; then
            echo "::error::native build produced no $apk — the Android chain did not complete"
            find android/app/build/outputs -name '*.apk' 2>/dev/null || true
            exit 1
          fi
          echo "native chain complete: $apk ($(du -h "$apk" | cut -f1))"

      - name: Stage otp.zip and build the AAB
        working-directory: development/mob
        run: mix mob.release --android

      - name: Assemble the split APKs from the same staging
        working-directory: development/mob/android
        run: |
          set -euo pipefail
          ./gradlew assembleRelease --no-daemon -PsplitAbi

      - name: Name the outputs after the release
        working-directory: development/mob
        run: |
          set -euo pipefail
          v="${{ needs.version.outputs.version }}"
          out="android/app/build/outputs/apk/release"
          mkdir -p dist
          pick() {
            local match
            match="$(ls "$out"/app-$1-release*.apk 2>/dev/null | head -1 || true)"
            if [ -z "$match" ]; then
              echo "::error::no APK matched app-$1-release*.apk in $out"
              ls -la "$out" || true
              exit 1
            fi
            cp "$match" "dist/mishka_mob_${v}_android_$2.apk"
            echo "  $2 <- $(basename "$match")"
          }
          pick "arm64-v8a"   "arm64-v8a"
          pick "armeabi-v7a" "armeabi-v7a"
          pick "universal"   "universal"
          aab="$(ls android/app/build/outputs/bundle/release/*.aab 2>/dev/null | head -1 || true)"
          [ -n "$aab" ] && cp "$aab" "dist/mishka_mob_${v}_android.aab"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: development/mob/dist/*
          if-no-files-found: error

  android-e2e:
    name: Android e2e
    needs: [version, mob-test]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: erlef/setup-beam@v1.20.4
        with:
          elixir-version: ${{ env.MOB_ELIXIR_VERSION }}
          otp-version: ${{ env.MOB_OTP_VERSION }}

      - uses: android-actions/setup-android@v3

      - name: Install the pinned NDK
        run: sdkmanager --install "ndk;${{ env.ANDROID_NDK_VERSION }}" "cmake;3.22.1"

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache the Mob OTP runtimes
        uses: actions/cache@v4.2.4
        with:
          path: ~/.mob/cache
          key: ${{ runner.os }}-mob-otp-${{ hashFiles('development/mob/mix.lock') }}
          restore-keys: ${{ runner.os }}-mob-otp-

      - working-directory: development/mob
        run: mix deps.get

      - name: Write mob.exs (gitignored — machine-specific by design)
        working-directory: development/mob
        run: |
          set -euo pipefail
          test -f mob.exs || cat > mob.exs <<'EOF'
          import Config

          config :mob_dev,
            mob_dir: Path.join(File.cwd!(), "deps/mob"),
            elixir_lib:
              System.get_env("MOB_ELIXIR_LIB", :code.lib_dir(:elixir) |> to_string() |> Path.dirname())

          config :mob, :plugins, [:mob_camera, :mob_location, :mob_biometric]

          config :mob, :trusted_plugins, %{
            mob_camera: "ed25519:nc56w+1Kx0gIt/4EkHxnMZCKHMzp4+S5kS/HoSzEZkg=",
            mob_location: "ed25519:nc56w+1Kx0gIt/4EkHxnMZCKHMzp4+S5kS/HoSzEZkg=",
            mob_biometric: "ed25519:nc56w+1Kx0gIt/4EkHxnMZCKHMzp4+S5kS/HoSzEZkg="
          }
          EOF

      - name: Prefetch the Android OTP runtimes
        working-directory: development/mob
        run: |
          set -euo pipefail
          mix run --no-start -e '
            paths =
              for {abi, key} <- [
                    {"arm64-v8a", "mob.otp_release"},
                    {"armeabi-v7a", "mob.otp_release_arm32"},
                    {"x86_64", "mob.otp_release_x86_64"}
                  ] do
                {:ok, path} = MobDev.OtpDownloader.ensure_android(abi)
                IO.puts("#{abi} -> #{path}")
                "#{key}=#{path}"
              end

            props =
              [
                "sdk.dir=#{System.fetch_env!("ANDROID_HOME")}",
                "mob.mob_dir=#{Path.join(File.cwd!(), "deps/mob")}"
                | paths
              ]

            File.write!("android/local.properties", Enum.join(props, "\n") <> "\n")
          '
          cat android/local.properties

      - name: Deploy and run the device suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          working-directory: development/mob
          script: |
            mix android.native
            adb logcat -c || true
            (adb logcat -v time > "$RUNNER_TEMP/logcat.txt" 2>&1 &) || true
            mix e2e

      - name: Show the crash context from logcat
        if: failure()
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/logcat.txt"
          [ -f "$f" ] || { echo "no logcat captured"; exit 0; }
          echo "── TapProbe: geometry at each cross-window tap ────────────────"
          grep -E "TapProbe" "$f" | sed 's/.*TapProbe[^:]*: //' | head -40 \
            || echo "(none — the tap sites were never reached)"

          echo "── AndroidRuntime / Compose / mob ─────────────────────────────"
          grep -nE "AndroidRuntime|FATAL|Compose|SlotTable|mishka_mob|MobBridge" "$f" \
            | tail -120 || echo "(no matching lines)"

      - name: Keep the emulator logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e-logs
          path: |
            development/mob/android/app/build/reports/**
            development/mob/*.log
            ${{ runner.temp }}/logcat.txt
          if-no-files-found: ignore

  release:
    name: Publish GitHub release
    needs:
      - version
      - library-test
      - idempotency
      - web-test
      - semgrep
      - retire-js
      - deps-audit
      - cms-bundles
      - hex-package
      - ebin-package
      - mob-test
      - android-apks
      - android-e2e
    if: ${{ needs.version.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Lay the assets out flat and confirm every one arrived
        run: |
          set -euo pipefail
          v="${{ needs.version.outputs.version }}"
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          expected=(
            "chelekom.json"
            "chelekom_headless.json"
            "mishka_chelekom-$v.tar"
            "mishka_chelekom-$v-ebin.tar.gz"
            "mishka_mob_${v}_android_arm64-v8a.apk"
            "mishka_mob_${v}_android_armeabi-v7a.apk"
            "mishka_mob_${v}_android_universal.apk"
          )
          missing=0
          for f in "${expected[@]}"; do
            if [ ! -f "release/$f" ]; then echo "::error::missing release asset: $f"; missing=1; fi
          done
          [ "$missing" -eq 0 ] || { ls -la release; exit 1; }
          ( cd release && sha256sum * > SHA256SUMS.txt )
          ls -la release

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: v${{ needs.version.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/*
