name: Mix Dependency Submission

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  submit-dependencies:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Elixir
        uses: erlef/setup-beam@v1.24.1
        with:
          elixir-version: "1.20.5-otp-29"
          otp-version: "29.1.2"

      - name: Submit Mix dependencies
        uses: erlef/mix-dependency-submission@v1.3.5
        with:
          install-deps: true
