name: Test
permissions:
  contents: read

on:
  push:
    branches: [master, mob-showcase]
  pull_request:
    branches: [master]

env:
  ELIXIR_VERSION: "1.20.4"
  # TEMPORARY: OTP 29.0.5 is the newest OTP without httpc's response-header limit
  # (OTP >= 29.0.6: max_header_size, default 10240 bytes). GitHub's release redirect sends
  # about 10.8 KB of headers, so precompiled-NIF downloads (rustler_precompiled, elixir_make,
  # tailwind) fail with {:header_too_long, {:max, 10240}}. Move back to the latest OTP once
  # GitHub shrinks that header or those libraries pass max_header_size.
  # The test job's matrix below cannot read env: keep its otp entry equal to this value.
  OTP_VERSION: "29.0.5"

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        elixir: ["1.20.4"]
        # TEMPORARY pin, see OTP_VERSION at the top of this file.
        otp: ["29.0.5"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Elixir
        uses: erlef/setup-beam@v1.24.1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Restore dependencies cache
        uses: actions/cache@v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install dependencies
        run: mix deps.get

      - name: Compile project
        run: mix compile --warnings-as-errors

      - name: Check formatting
        run: mix format --check-formatted

      - name: Create formatter for tests
        run: |
          echo '[inputs: ["*.{ex,exs}", "{config,lib,test}/**/*.{ex,exs}"]]' > /tmp/.formatter.exs

      - name: Run tests
        env:
          MIX_ENV: test
        run: mix test --trace

      - name: Run JS engine tests
        working-directory: priv/assets/js
        run: node --test

  idempotency:
    name: Generators are idempotent (development harness)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Elixir
        uses: erlef/setup-beam@v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Restore dependencies cache
        uses: actions/cache@v6.1.0
        with:
          path: |
            development/web/deps
            development/web/_build
          key: ${{ runner.os }}-mix-web-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('development/web/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-web-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install development harness deps
        working-directory: development/web
        run: mix deps.get

      - name: Generators must produce no changes on re-run
        working-directory: development/web
        env:
          MIX_ENV: dev
        run: mix run --no-start idempotency_check.exs

  mob:
    name: Mob showcase app (development/mob)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Elixir
        uses: erlef/setup-beam@v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Restore dependencies cache
        uses: actions/cache@v6.1.0
        with:
          path: |
            development/mob/deps
            development/mob/_build
          key: ${{ runner.os }}-mix-mob-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('development/mob/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-mob-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install dependencies
        working-directory: development/mob
        run: mix deps.get

      - name: Compile project
        working-directory: development/mob
        run: mix compile --warnings-as-errors

      - name: Check formatting
        working-directory: development/mob
        run: mix format --check-formatted

      - name: Run tests
        working-directory: development/mob
        env:
          MIX_ENV: test
        run: mix test
